{{ with .Site.Data.homepage.about }}
{{ if .enable }}
<section class="portfolio-section" id="research" aria-labelledby="research-heading">
  <div class="container">
    <div class="portfolio-split">
      <div>
        <h2 class="portfolio-heading" id="research-heading">{{ .title }}</h2>
        <p class="portfolio-intro">{{ .content }}</p>
        <a class="portfolio-link" href="{{ .button1.URL | relURL }}">{{ .button1.btnText }} (PDF)</a>
      </div>
      <div class="portfolio-entries">
        {{ range .items }}
        <article>
          {{ with .type }}<p class="portfolio-meta">{{ . }}</p>{{ end }}
          <h3>{{ .title }}</h3>
          <p>{{ .description }}</p>
          {{ if .link }}<a class="portfolio-link" href="{{ .link }}" aria-label="Read paper: {{ .title }}">Read paper</a>{{ end }}
        </article>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
