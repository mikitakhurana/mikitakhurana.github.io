{{ with .Site.Data.homepage.experience }}
{{ if .enable }}
<section class="portfolio-section" id="teaching" aria-labelledby="teaching-heading">
  <div class="container">
    <div class="portfolio-split">
      <div>
        <h2 class="portfolio-heading" id="teaching-heading">{{ .title }}</h2>
        <p class="portfolio-intro">{{ .description }}</p>
        <a class="portfolio-link" href="{{ .button.URL | relURL }}">{{ .button.btnText }} (PDF)</a>
      </div>
      <div class="portfolio-entries">
        {{ range .items }}
        <article>
          <p class="portfolio-meta">{{ .duration }}</p>
          <h3>{{ .title }}</h3>
          <p>{{ .company }}</p>
          <ul class="portfolio-list">
            {{ range .details }}
            <li>{{ .description }}</li>
            {{ end }}
          </ul>
        </article>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
