{{ with .Site.Data.homepage.conferences }}
{{ if .enable }}
<section class="portfolio-section conferences-section" id="conferences" aria-labelledby="conferences-heading">
  <div class="container">
    <div class="portfolio-split">
      <h2 class="portfolio-heading" id="conferences-heading">{{ .title }}</h2>
      <ul class="portfolio-list">
        {{ range .items }}
        <li>{{ .description }}</li>
        {{ end }}
      </ul>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
